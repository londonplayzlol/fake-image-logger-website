<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fart Bomb Chaos 💣💨</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ================= GLOBAL ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: manipulation;
  font-family: system-ui, sans-serif;
}

body {
  background: radial-gradient(circle at top, #1d0033, #000);
  color: white;
}

/* ================= RESPONSIVE VARS ================= */
:root {
  --runner-size: 160px;
  --runner-scale: 1.6;
  --ground-height: 110px;
  --speed: 3.4s;
}

@media (max-width: 768px) {
  :root {
    --runner-size: 120px;
    --runner-scale: 1.3;
    --ground-height: 90px;
    --speed: 1.6s;
  }
}

/* ================= UI ================= */
.title {
  position: fixed;
  top: 12px;
  width: 100%;
  text-align: center;
  font-size: 1.2rem;
  opacity: 0.8;
  z-index: 50;
}

/* ================= GROUND ================= */
.ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: var(--ground-height);
  background: linear-gradient(#222, #000);
  z-index: 5;
}

/* ================= RUNNER ================= */
.bolt {
  position: absolute;
  bottom: var(--ground-height);
  left: -40%;
  width: var(--runner-size);
  transform: scale(var(--runner-scale));
  transform-origin: bottom center;
  animation: run var(--speed) linear infinite;
  z-index: 10;
  will-change: transform, left;
}

@keyframes run {
  from { left: -40%; }
  to   { left: 110%; }
}

/* ================= FART (MOBILE SAFE) ================= */
.fart {
  position: absolute;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  pointer-events: none;

  background: radial-gradient(
    circle,
    rgba(255,255,255,.9),
    rgba(0,255,255,.6),
    rgba(0,0,0,0)
  );

  filter: blur(2px);
  animation: fartFloat 1.2s ease-out forwards;
}

@keyframes fartFloat {
  from {
    transform: scale(0.6);
    opacity: 1;
  }
  to {
    transform: translateX(-80px) translateY(-40px) scale(1.8);
    opacity: 0;
  }
}

/* ================= BOMB ================= */
.bomb {
  position: absolute;
  top: -50px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #777, #111);
  box-shadow: inset -3px -5px 6px rgba(0,0,0,.7);
  animation: fall 2.4s linear forwards;
}

.bomb::after {
  content: "";
  position: absolute;
  top: -10px;
  left: 50%;
  width: 6px;
  height: 6px;
  background: orange;
  border-radius: 50%;
  transform: translateX(-50%);
}

@keyframes fall {
  to { top: calc(100vh - var(--ground-height)); }
}

/* ================= EXPLOSION ================= */
.explosion {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff, yellow, red, transparent);
  animation: boom 0.6s ease-out forwards;
  pointer-events: none;
}

@keyframes boom {
  to {
    transform: scale(6);
    opacity: 0;
  }
}

/* ================= SCREEN SHAKE (SAFE) ================= */
.shake {
  animation: shake 0.25s;
}

@keyframes shake {
  0% { transform: translate(0); }
  25% { transform: translate(-5px, 3px); }
  50% { transform: translate(4px, -3px); }
  75% { transform: translate(-3px, 2px); }
  100% { transform: translate(0); }
}

/* ================= RAGDOLL (MOBILE FRIENDLY) ================= */
.ragdoll {
  animation: ragdollMobile 0.8s ease-out forwards !important;
}

@keyframes ragdollMobile {
  0%   { transform: scale(var(--runner-scale)) rotate(0deg); }
  40%  { transform: scale(var(--runner-scale)) rotate(25deg) translateY(-20px); }
  70%  { transform: scale(var(--runner-scale)) rotate(-30deg) translateY(30px); }
  100% { transform: scale(var(--runner-scale)) rotate(0deg) translateY(70px); }
}
</style>
</head>

<body>

<div class="title">💣 FART BOMB CHAOS 💨</div>

<img
  src="runner.png"
  class="bolt"
  id="bolt"
  alt="runner"
/>

<div class="ground"></div>

<audio id="fartSound" src="https://www.myinstants.com/media/sounds/fart.mp3"></audio>
<audio id="boomSound" src="https://www.myinstants.com/media/sounds/explosion.mp3"></audio>

<script>
const bolt = document.getElementById("bolt");
const fartSound = document.getElementById("fartSound");
const boomSound = document.getElementById("boomSound");
const isMobile = window.innerWidth < 768;

/* ================= FART LOOP ================= */
setInterval(() => {
  const fart = document.createElement("div");
  fart.className = "fart";

  const rect = bolt.getBoundingClientRect();
  fart.style.left = rect.left + "px";
  fart.style.top = rect.top + rect.height * 0.6 + "px";

  document.body.appendChild(fart);
  fartSound.currentTime = 0;
  fartSound.play().catch(()=>{});

  setTimeout(() => fart.remove(), 1200);
}, isMobile ? 300 : 200);

/* ================= BOMB LOOP ================= */
setInterval(() => {
  const bomb = document.createElement("div");
  bomb.className = "bomb";
  bomb.style.left = Math.random() * window.innerWidth + "px";
  document.body.appendChild(bomb);

  setTimeout(() => explode(bomb), 2200);
}, isMobile ? 700 : 450);

/* ================= EXPLOSION ================= */
function explode(bomb) {
  if (!bomb) return;

  const rect = bomb.getBoundingClientRect();
  bomb.remove();

  const exp = document.createElement("div");
  exp.className = "explosion";
  exp.style.left = rect.left + "px";
  exp.style.top = rect.top + "px";
  document.body.appendChild(exp);

  boomSound.currentTime = 0;
  boomSound.play().catch(()=>{});

  document.body.classList.add("shake");
  setTimeout(() => document.body.classList.remove("shake"), 250);

  if (Math.random() < 0.25) ragdoll();

  setTimeout(() => exp.remove(), 600);
}

/* ================= RAGDOLL ================= */
function ragdoll() {
  bolt.classList.add("ragdoll");
  setTimeout(() => bolt.classList.remove("ragdoll"), 800);
}
</script>

</body>
</html>
